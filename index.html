<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>널리 (Nolly)</title>
<meta name="description" content="널리(Nolly)가 만드는 앱과 각 앱의 개인정보처리방침·지원 안내입니다.">
<style>
  :root {
    --bg: #ffffff; --surface: #f1f4f8; --text: #081c2f; --muted: #5c7086;
    --brand: #1b5fc1; --accent: #e2b33c; --border: #e3e8ef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #081c2f; --surface: #102a43; --text: #eef3f8; --muted: #9fb0c3;
      --brand: #8fb8f0; --border: #243b53;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Pretendard", "Noto Sans KR", sans-serif;
    font-size: 17px; line-height: 1.75; word-break: keep-all;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 16px 80px; }
  h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -0.5px; }
  .lede { color: var(--muted); margin: 0 0 36px; }
  .app {
    display: block; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 22px 24px; margin-bottom: 16px;
  }
  .app:hover { border-color: var(--brand); }
  .app-head { display: flex; align-items: center; gap: 12px; }
  .mark {
    width: 38px; height: 38px; border-radius: 10px; flex: 0 0 auto;
    background: linear-gradient(145deg, #102a43, #1b5fc1); position: relative;
  }
  .mark::after {
    content: ""; position: absolute; inset: 10px 8px; border-radius: 2px;
    background: #fff; box-shadow: inset 0 -1px 0 var(--accent);
  }
  .app strong { font-size: 19px; letter-spacing: -0.2px; }
  .app p { margin: 10px 0 0; color: var(--muted); font-size: 15px; }
  .links { margin-top: 12px; font-size: 14px; color: var(--brand); }
  footer {
    margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 14px;
  }
  a { color: var(--brand); }
  @media (max-width: 480px) { body { font-size: 16px; } h1 { font-size: 26px; } }
</style>
</head>
<body>
<div class="wrap">
<h1>널리 (Nolly)</h1>
<p class="lede">하루를 거드는 작은 앱을 만듭니다.</p>

<a class="app" href="./gyeongjosa/">
  <span class="app-head"><span class="mark" aria-hidden="true"></span><strong>경조사관리</strong></span>
  <p>인생의 모든 경조사를 한 곳에서 — 주고받은 경조사비 기록, 일정 알림, 부고·청첩 알리기.</p>
  <span class="links">앱 안내 · 개인정보처리방침 · 이용약관 · 문의 · 계정 삭제 →</span>
</a>

<footer>
  <p>널리(Nolly) · 대표 안시우 · 사업자등록번호 275-51-01041</p>
  <p>문의: <a href="mailto:siwoosdev@gmail.com">siwoosdev@gmail.com</a></p>
</footer>
</div>
</body>
</html>
